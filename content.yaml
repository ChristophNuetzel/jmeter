funktionen:
  title: Wichtigste Funktionen von JMeter
  intro: Apache JMeter gibt es seit 1998. Das Tool wurde ursprünglich für Last-, Performance- und Belastungstests entwickelt
    und unterstützt heute vielfältige Schnittstellen, Testdaten und automatisierte Testabläufe.
  sections:
  - title: Allgemeine Funktionen
    items:
    - Seit 1998 kontinuierlich weiterentwickelt und verbessert
    - Ursprünglich für Last-, Performance- und Belastungstests entwickelt
    - Unterstützung für HTTP- und REST-APIs
    - Unterstützung für Webanwendungen
    - JDBC-Datenbanken
    - FTP, JMS und weitere Protokolle
    - Erweiterbar durch Plugins und Skripte
    - Auswertung von Antwortzeiten, Durchsatz und Fehlerraten zur Laufzeit
    placeholder: Weitere Funktion ergänzen …
  - title: Testerstellung und Testdaten
    items:
    - Low-Code-Ansatz durch konfigurierbare Testelemente und Bausteine
    - Automatisierung vollständiger End-to-End-Testabläufe
    - Verwendung von Variablen, Zufallswerten und Wartezeiten
    - Einlesen und Nutzen von Testdaten aus externen Quellen
    - Eigene Fehlerausgaben und Abbruchbedingungen pro Schritt definierbar
    - Für komplexere Testlogik durch Groovy-Code erweiterbar
    placeholder: Weitere Funktion ergänzen …
  - title: Datenbank und Testausführung
    items:
    - 'Datenbankanbindung über JDBC: SQL-Abfragen ausführen und Ergebnisse im Testablauf weiterverwenden'
    - Automatisierte Ausführung über Jenkins beziehungsweise CI/CD-Pipelines
    - Übermittlung von Testergebnissen an TestRail über eine Integration oder API
    - Open-Source-Plugin-Manager und große, aktive Community
    - Bei Bedarf mit Selenium für Browser-Automatisierung kombinierbar
    placeholder: Weitere Funktion ergänzen …
projekterfahrung:
  title: Bisherige Projekterfahrung
  intro: Praktischer Einsatz von JMeter in den Projekten Hello Fresh, Sano und Eurofit. Die Projektkarten lassen sich einzeln
    ein- und ausklappen.
  projects:
  - name: Hello Fresh
    tag: End-to-End
    sections:
    - title: Umsetzung
      items:
      - 'Zwei vollständige End-to-End-Regressionstests automatisiert: Sunny Case und Fehlerfall'
      - SHORT- und FULL-Pick sowie NR- und OOS-Buffer-Test abgedeckt
      - Testdaten und Bestandsverwaltung in CSV von der Ausführungslogik in JMeter getrennt
      - Während der Ausführung alle HOST-Telegramme validiert
      - Validierungen durch SQL-Abfragen
      - DVF per REST angesprochen
      - LightSim umgangen und Picking per REST-Aufrufen ausgeführt
      - Tests im Non-GUI-Modus über Jenkins verwaltet
      - Jenkins-Reporting konfiguriert
      - Erweitertes Logging pro Schritt erstellt und in Jenkins integriert
    - title: Herausforderungen
      items:
      - REST-Aufrufe für LightSim ermitteln, automatisieren und parametrisieren
      - 'Dynamisches Polling: auf einen Karton warten und erst nach dessen Ankunft fortfahren, statt feste Wartezeiten zu
        verwenden'
      - Klärung der Ladeeinheit war nur über einen Dialog möglich; deshalb war Selenium in JMeter erforderlich
  - name: Sano
    tag: FAT, End-to-End
    items:
    - JMeter für alle End-to-End-Tests verwendet
    - Support im FAT-Meeting
    - 90 % der FAT-Testfälle bereits vor dem FAT-Termin automatisiert
    - Testdaten mit JMeter zur Vorbereitung des FAT-Meetings angelegt
    - 'Cleanup-Jobs für saubere Testergebnisse erstellt: deleteLoadUnit und loadUnitLeft'
    - Jobs in Jenkins angelegt und mit Logging und Reporting ausgeführt
  - name: Eurofit
    tag: Testdaten
    items:
    - JMeter zur Testdatenanlage eingesetzt
    - SQL-Abfragen für Avisen und Orders verwendet
    - End-to-End-Automatisierung mit AutoMod und Classic war nicht möglich
  summaryTitle: Zusammenfassung
  summary: Durch die Projekte Hello Fresh, Sano und Eurofit konnte ich praktische Erfahrungen mit Apache JMeter sammeln. Dabei
    habe ich Testabläufe erstellt, Schnittstellen getestet, Testdaten vorbereitet und Testergebnisse ausgewertet.
prosCons:
  title: Vorteile und Nachteile
  intro: Eine praxisnahe Einschätzung von Apache JMeter für automatisierte System- und End-to-End-Tests.
  advantagesTitle: Vorteile
  advantages:
  - Kostenloses Open-Source-Tool unter der Apache-Lizenz
  - Erstellung von End-to-End-Tests mit einem Low-Code-Ansatz
  - Einfache Integration in Jenkins und CI/CD-Pipelines
  - Viele Erweiterungen durch Plugins sowie eine große Community
  - Viele Hilfskomponenten für Testdatenmanagement, Variablen, Zufallswerte, JDBC, Groovy, TestRail, Counter und Logging
  - Deutlich umfangreichere Möglichkeiten als reine API-Tools wie Postman oder Bruno
  disadvantagesTitle: Nachteile
  disadvantages:
  - Weniger geeignet für Projekte mit vielen kundenspezifischen UI-Dialoginteraktionen
  - 'Mögliche Lösung: nachträgliche Implementierung oder Erweiterung der DiQ API'
  - Komplexe Testabläufe benötigen Einarbeitung und teilweise Groovy-Skripte
  - Erhöhter Analyseaufwand bei Fehlschlägen, insbesondere im Hinblick auf Stabilität und Robustheit
  disadvantagePlaceholder: Weiteren Nachteil ergänzen …
  fazitTitle: Fazit
  fazit:
  - Testpläne müssen bei Änderungen an Schnittstellen gepflegt werden.
  fazitPlaceholder: Weiteres Fazit ergänzen …
